<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DM Store</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A;--bg2:#111;--bg3:#1A1A1A;--surface:#141414;
  --border:rgba(255,255,255,0.08);--border-md:rgba(255,255,255,0.14);
  --text:#F0EEE8;--text2:#9A9890;--text3:#5A5856;
  --green:#1D9E75;--green-lt:rgba(29,158,117,0.15);
  --red:#D85A30;--red-lt:rgba(216,90,48,0.15);
  --amber:#EF9F27;--amber-lt:rgba(239,159,39,0.15);
  --blue:#378ADD;--blue-lt:rgba(55,138,221,0.15);
  --purple:#7F77DD;--purple-lt:rgba(127,119,221,0.15);
  --nav-h:64px;--r:12px;--rl:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);font-size:15px;}

/* APP SHELL */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.header-brand{display:flex;align-items:center;gap:10px;}
.header-logo{width:28px;height:28px;border-radius:5px;object-fit:cover;}
.header-title{font-size:15px;font-weight:700;}
.header-right{display:flex;align-items:center;gap:8px;}
.dolar-tag{font-size:11px;font-family:'Space Mono',monospace;color:var(--blue);background:var(--blue-lt);padding:4px 10px;border-radius:20px;border:none;cursor:pointer;}
.refresh-btn{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;padding:4px;}

/* SCREENS */
.screens{flex:1;overflow:hidden;position:relative;}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding:16px 16px calc(var(--nav-h) + 16px);}
.screen.active{display:block;}

/* BOTTOM NAV */
.bottom-nav{height:var(--nav-h);background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:stretch;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:10px;font-family:'Space Grotesk',sans-serif;font-weight:500;transition:color 0.15s;padding-top:8px;}
.nav-btn svg{width:22px;height:22px;opacity:0.5;transition:opacity 0.15s;}
.nav-btn.active{color:var(--text);}
.nav-btn.active svg{opacity:1;}
.nav-btn-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;padding-top:4px;}
.nav-center-dot{width:52px;height:52px;background:var(--text);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-20px;box-shadow:0 4px 20px rgba(0,0,0,0.5);}
.nav-center-dot svg{width:24px;height:24px;color:var(--bg);}
.nav-center-label{font-size:10px;color:var(--text3);margin-top:4px;font-family:'Space Grotesk',sans-serif;}

/* STATUS */
.status-bar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);font-family:'Space Mono',monospace;margin-bottom:16px;}
.dot{width:6px;height:6px;border-radius:50%;background:#444;flex-shrink:0;}
.dot.ok{background:var(--green);}
.dot.err{background:var(--red);}
.dot.loading{background:var(--amber);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* DASHBOARD */
.sec-label{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;font-family:'Space Mono',monospace;}
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;}
.mc-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;font-family:'Space Mono',monospace;}
.mc-val{font-size:18px;font-weight:700;font-family:'Space Mono',monospace;line-height:1.2;}
.mc-val.pos{color:var(--green);}
.mc-val.neg{color:var(--red);}
.mc-val2{font-size:14px;font-weight:700;font-family:'Space Mono',monospace;color:var(--blue);margin-top:4px;}
.mc-sub{font-size:10px;color:var(--text3);margin-top:3px;font-family:'Space Mono',monospace;}
.mc-full{grid-column:1/-1;}

/* UNIT CARDS */
.unit-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.uc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;position:relative;overflow:hidden;}
.uc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--uc,#fff);}
.uc-name{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;font-family:'Space Mono',monospace;}
.uc-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.uc-row span:first-child{color:var(--text3);}
.uc-saldo{font-size:16px;font-weight:700;font-family:'Space Mono',monospace;border-top:1px solid var(--border);padding-top:8px;margin-top:8px;}

/* MOVIMIENTOS LIST */
.mov-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.mov-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px;}
.mov-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.mov-fecha{font-size:11px;color:var(--text3);font-family:'Space Mono',monospace;}
.mov-badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;font-family:'Space Mono',monospace;}
.b-ventas{background:var(--blue-lt);color:var(--blue);}
.b-servicios{background:var(--green-lt);color:var(--green);}
.b-compra{background:var(--amber-lt);color:var(--amber);}
.b-gastos{background:var(--red-lt);color:var(--red);}
.b-inversion{background:var(--purple-lt);color:var(--purple);}
.b-ajuste{background:rgba(255,255,255,0.07);color:var(--text2);}
.mov-desc{font-size:13px;color:var(--text2);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mov-foot{display:flex;justify-content:space-between;align-items:center;}
.mov-unidad{font-size:11px;color:var(--text3);}
.mov-monto{font-size:15px;font-weight:700;font-family:'Space Mono',monospace;}
.mov-monto.ing{color:var(--green);}
.mov-monto.egr{color:var(--red);}

/* FORM */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:18px;margin-bottom:16px;}
.form-title{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border);font-family:'Space Mono',monospace;}
.fgroup{margin-bottom:14px;}
.fgroup label{display:block;font-size:11px;font-weight:500;color:var(--text2);margin-bottom:6px;font-family:'Space Mono',monospace;}
.fgroup input,.fgroup select{
  width:100%;padding:12px 14px;border:1px solid var(--border-md);border-radius:var(--r);
  font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--text);
  background:var(--bg3);outline:none;-webkit-appearance:none;
}
.fgroup input:focus,.fgroup select:focus{border-color:rgba(255,255,255,0.3);}
.fgroup select option{background:var(--bg3);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.btn-submit{width:100%;padding:15px;background:var(--text);color:var(--bg);border:none;border-radius:var(--r);font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px;}
.btn-submit:disabled{opacity:0.4;}
.btn-clear{width:100%;padding:12px;background:transparent;color:var(--text2);border:1px solid var(--border-md);border-radius:var(--r);font-family:'Space Grotesk',sans-serif;font-size:14px;cursor:pointer;margin-top:8px;}

/* SUCCESS OVERLAY */
.success-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.success-overlay.show{display:flex;}
.success-icon{font-size:64px;}
.success-text{font-size:20px;font-weight:700;color:var(--text);}
.success-sub{font-size:14px;color:var(--text2);}

/* TOAST */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:all 0.25s;z-index:200;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--red);color:#fff;}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-brand">
      <img id="sb-logo" class="header-logo" alt="logo">
      <div class="header-title">DM Store</div>
    </div>
    <div class="header-right">
      <button class="dolar-tag" id="dolar-tag" onclick="fetchDolar(true)">USD...</button>
      <button class="refresh-btn" onclick="cargarDatos()">↻</button>
    </div>
  </div>

  <!-- SCREENS -->
  <div class="screens">

    <!-- DASHBOARD -->
    <div class="screen active" id="screen-dash">
      <div class="status-bar"><div class="dot loading" id="s-dot"></div><span id="s-txt">CONECTANDO...</span></div>

      <div class="sec-label">Resumen general</div>
      <div class="metrics-grid">
        <div class="mc mc-full">
          <div class="mc-label">Caja total</div>
          <div class="mc-val pos" id="m-caja">-</div>
          <div class="mc-val2" id="m-usd">-</div>
        </div>
        <div class="mc">
          <div class="mc-label">Ingresos</div>
          <div class="mc-val pos" id="m-ing">-</div>
          <div class="mc-sub">ARS</div>
        </div>
        <div class="mc">
          <div class="mc-label">Egresos</div>
          <div class="mc-val neg" id="m-egr">-</div>
          <div class="mc-sub">ARS</div>
        </div>
        <div class="mc mc-full">
          <div class="mc-label">Deudores</div>
          <div class="mc-val" id="m-deuda">-</div>
          <div class="mc-sub" id="m-deuda-label">-</div>
        </div>
      </div>

      <div class="sec-label">Unidades de negocio</div>
      <div class="unit-cards" id="unit-cards"></div>

      <div class="sec-label">Ultimos movimientos</div>
      <div class="mov-list" id="mov-list"></div>
    </div>

    <!-- CARGAR -->
    <div class="screen" id="screen-cargar">
      <div class="form-card">
        <div class="form-title">Nuevo movimiento</div>
        <div class="fgroup">
          <label>Fecha *</label>
          <input type="date" id="f-fecha">
        </div>
        <div class="form-row">
          <div class="fgroup">
            <label>Unidad *</label>
            <select id="f-unidad"><option value="">Selecciona...</option></select>
          </div>
          <div class="fgroup">
            <label>Metodo *</label>
            <select id="f-metodo"><option value="">Selecciona...</option></select>
          </div>
        </div>
        <div class="fgroup">
          <label>Operacion *</label>
          <select id="f-operacion" onchange="updateCats()"><option value="">Selecciona...</option></select>
        </div>
        <div class="fgroup">
          <label>Categoria</label>
          <select id="f-categoria"><option value="">Selecciona operacion primero</option></select>
        </div>
        <div class="fgroup">
          <label>Descripcion</label>
          <input type="text" id="f-desc" placeholder="Ej: Venta iPhone 15">
        </div>
        <div class="form-row">
          <div class="fgroup">
            <label>Ingreso (ARS)</label>
            <input type="number" id="f-ingreso" placeholder="0" inputmode="decimal">
          </div>
          <div class="fgroup">
            <label>Egreso (ARS)</label>
            <input type="number" id="f-egreso" placeholder="0" inputmode="decimal">
          </div>
        </div>
        <div class="fgroup">
          <label>Nota</label>
          <input type="text" id="f-nota" placeholder="Opcional">
        </div>
        <button class="btn-submit" id="btn-guardar" onclick="guardar()">Guardar movimiento</button>
        <button class="btn-clear" onclick="clearForm()">Limpiar</button>
      </div>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-dash" onclick="go('dash',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </button>
    <button class="nav-btn-center" onclick="go('cargar',document.getElementById('nav-cargar'))">
      <div class="nav-center-dot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <div class="nav-center-label">Cargar</div>
    </button>
    <button class="nav-btn" id="nav-cargar" onclick="go('cargar',this)" style="visibility:hidden;pointer-events:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/></svg>
      Cargar
    </button>
  </div>

</div>

<!-- SUCCESS -->
<div class="success-overlay" id="success-overlay">
  <div class="success-icon">✓</div>
  <div class="success-text">Guardado</div>
  <div class="success-sub" id="success-sub"></div>
</div>

<div class="toast" id="toast"></div>

var UCOLORS={CELULARES:'#7F77DD',TIENDAS:'#1D9E75','SERVICIO TECNICO':'#378ADD'};
var movs=[],dolarBlue=0;

function fmtARS(n){
  if(!n&&n!==0)return'';
  var abs=Math.abs(n);
  var s='$'+abs.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
  return n<0?'-'+s:s;
}
function fmtUSD(n){
  if(!n&&n!==0)return'';
  return'U$D '+Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fd(d){if(!d)return'';var s=String(d).slice(0,10);var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function ss(st,txt){document.getElementById('s-dot').className='dot '+st;document.getElementById('s-txt').textContent=txt;}
function showToast(msg,err){var t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(err?' err':'')+' show';setTimeout(function(){t.className='toast';},3000);}

function go(name,el){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('screen-'+name).classList.add('active');
  if(el)el.classList.add('active');
  if(name==='dash')renderDash();
}

function populateSelects(){
  var su=document.getElementById('f-unidad');
  su.innerHTML='<option value="">Selecciona...</option>'+CFG.unidades.map(function(u){return'<option>'+u+'</option>';}).join('');
  var so=document.getElementById('f-operacion');
  so.innerHTML='<option value="">Selecciona...</option>'+CFG.operaciones.map(function(o){return'<option>'+o+'</option>';}).join('');
  var sm=document.getElementById('f-metodo');
  sm.innerHTML='<option value="">Selecciona...</option>'+CFG.metodos.map(function(m){return'<option>'+m+'</option>';}).join('');
}

function updateCats(){
  var op=document.getElementById('f-operacion').value;
  var sel=document.getElementById('f-categoria');
  var cats=CFG.categorias[op];
  if(op&&cats&&cats.length){sel.innerHTML=cats.map(function(c){return'<option>'+c+'</option>';}).join('');}
  else{sel.innerHTML='<option value="">Selecciona operacion primero</option>';}
}

async function fetchDolar(manual){
  try{
    var res=await fetch('https://dolarapi.com/v1/dolares/blue');
    var d=await res.json();
    dolarBlue=d.venta||d.compra||0;
    document.getElementById('dolar-tag').textContent='Blue $'+Math.round(dolarBlue).toLocaleString('es-AR');
    if(manual)showToast('Cotizacion actualizada');
  }catch(e){
    document.getElementById('dolar-tag').textContent='USD s/c';
  }
}

function norm(r){
  var n={};
  Object.keys(r).forEach(function(k){n[k.trim().toUpperCase()]=r[k];});
  return{
    fecha:String(n['FECHA']||'').slice(0,10),
    unidad:String(n['UNIDAD']||'').trim().toUpperCase(),
    operacion:String(n['OPERACION']||'').trim().toUpperCase(),
    categoria:String(n['CATEGORIA']||'').trim(),
    desc:String(n['DESCRIPCION']||'').trim(),
    ingreso:parseFloat(n['INGRESO'])||0,
    egreso:parseFloat(n['EGRESO'])||0,
    metodo:String(n['METODO']||'').trim().toUpperCase(),
  };
}

async function cargarDatos(){
  ss('loading','SINCRONIZANDO...');
  try{
    var res=await fetch(API+'?t='+Date.now());
    var json=await res.json();
    if(json.ok&&json.data){
      movs=json.data.map(norm).sort(function(a,b){return b.fecha.localeCompare(a.fecha);});
      ss('ok',movs.length+' registros');
      renderDash();
    }else{ss('err','Error al cargar');}
  }catch(e){ss('err','Sin conexion');}
}

function renderDash(){
  var nd=movs.filter(function(m){return m.metodo!=='DEUDA';});
  var tIng=nd.reduce(function(s,m){return s+m.ingreso;},0);
  var tEgr=nd.reduce(function(s,m){return s+m.egreso;},0);
  var cajaTot=movs.filter(function(m){return m.metodo!=='DEUDA'&&m.metodo!=='USD';}).reduce(function(s,m){return s+m.ingreso-m.egreso;},0);
  var cajaUSD=movs.filter(function(m){return m.metodo==='USD';}).reduce(function(s,m){return s+m.ingreso-m.egreso;},0);
  document.getElementById('m-caja').textContent=fmtARS(cajaTot);
  document.getElementById('m-caja').className='mc-val '+(cajaTot>=0?'pos':'neg');
  document.getElementById('m-usd').textContent=fmtUSD(cajaUSD)+(dolarBlue?' = '+fmtARS(cajaUSD*dolarBlue):'');
  document.getElementById('m-ing').textContent=fmtARS(tIng);
  document.getElementById('m-egr').textContent=fmtARS(tEgr);
  var dIng=movs.filter(function(m){return m.metodo==='DEUDA';}).reduce(function(s,m){return s+m.ingreso;},0);
  var dEgr=movs.filter(function(m){return m.metodo==='DEUDA';}).reduce(function(s,m){return s+m.egreso;},0);
  var dSal=dIng-dEgr;
  document.getElementById('m-deuda').textContent=fmtARS(Math.abs(dSal));
  document.getElementById('m-deuda').className='mc-val '+(dSal>=0?'pos':'neg');
  document.getElementById('m-deuda-label').textContent=dSal>=0?'a favor (deudores)':'en contra (deuda)';

  // Unidades
  var unidades=['CELULARES','TIENDAS','SERVICIO TECNICO'];
  document.getElementById('unit-cards').innerHTML=unidades.map(function(u){
    var um=movs.filter(function(m){return m.unidad===u&&m.metodo!=='DEUDA';});
    var ing=um.reduce(function(s,m){return s+m.ingreso;},0);
    var egr=um.reduce(function(s,m){return s+m.egreso;},0);
    var sal=ing-egr;
    var col=UCOLORS[u]||'#fff';
    return'<div class="uc" style="--uc:'+col+'">'+
      '<div class="uc-name">'+u+'</div>'+
      '<div class="uc-row"><span>Ingresos</span><span style="color:var(--green);font-family:\'Space Mono\',monospace;font-size:13px;">'+fmtARS(ing)+'</span></div>'+
      '<div class="uc-row"><span>Egresos</span><span style="color:var(--red);font-family:\'Space Mono\',monospace;font-size:13px;">'+fmtARS(egr)+'</span></div>'+
      '<div class="uc-saldo" style="color:'+(sal>=0?'var(--green)':'var(--red)')+'">'+fmtARS(sal)+'</div>'+
      '</div>';
  }).join('');

  // Ultimos 10 movimientos
  var rec=movs.slice(0,10);
  document.getElementById('mov-list').innerHTML=rec.length?rec.map(function(m){
    var monto=m.ingreso||m.egreso;
    var isIng=m.ingreso>0;
    var isUSD=m.metodo==='USD';
    var montoStr=isUSD?fmtUSD(monto):fmtARS(monto);
    return'<div class="mov-card">'+
      '<div class="mov-card-head">'+
        '<span class="mov-fecha">'+fd(m.fecha)+'</span>'+
        '<span class="mov-badge '+(BOP[m.operacion]||'')+'">'+m.operacion+'</span>'+
      '</div>'+
      '<div class="mov-desc">'+(m.desc||m.categoria||'-')+'</div>'+
      '<div class="mov-foot">'+
        '<span class="mov-unidad">'+m.unidad+'</span>'+
        '<span class="mov-monto '+(isIng?'ing':'egr')+'">'+(isIng?'+':'-')+montoStr+'</span>'+
      '</div>'+
      '</div>';
  }).join(''):'<div style="text-align:center;padding:32px;color:var(--text3);">Sin movimientos</div>';
}

async function guardar(){
  var fecha=document.getElementById('f-fecha').value;
  var unidad=document.getElementById('f-unidad').value;
  var operacion=document.getElementById('f-operacion').value;
  var categoria=document.getElementById('f-categoria').value;
  var desc=document.getElementById('f-desc').value;
  var ingreso=parseFloat(document.getElementById('f-ingreso').value)||0;
  var egreso=parseFloat(document.getElementById('f-egreso').value)||0;
  var metodo=document.getElementById('f-metodo').value;
  var mensaje=document.getElementById('f-nota').value;
  if(!fecha||!unidad||!operacion||!metodo){showToast('Completa los campos obligatorios',true);return;}
  if(ingreso>0&&egreso>0){showToast('No puede tener ingreso Y egreso',true);return;}
  if(!ingreso&&!egreso){showToast('Ingresa al menos un monto',true);return;}
  var btn=document.getElementById('btn-guardar');
  btn.disabled=true;btn.textContent='Guardando...';
  try{
    var res=await fetch(API,{method:'POST',body:JSON.stringify({fecha:fecha,unidad:unidad,operacion:operacion,categoria:categoria,descripcion:desc,ingreso:ingreso,egreso:egreso,metodo:metodo,mensaje:mensaje})});
    var json=await res.json();
    if(json.ok){
      // Show success overlay
      var monto=ingreso||egreso;
      var isUSD=metodo==='USD';
      document.getElementById('success-sub').textContent=(ingreso?'+':'-')+(isUSD?fmtUSD(monto):fmtARS(monto))+' — '+unidad;
      document.getElementById('success-overlay').classList.add('show');
      clearForm();
      await cargarDatos();
      setTimeout(function(){
        document.getElementById('success-overlay').classList.remove('show');
        go('dash',document.getElementById('nav-dash'));
      },1800);
    }else{showToast('Error al guardar',true);}
  }catch(e){showToast('Error de conexion',true);}
  finally{btn.disabled=false;btn.textContent='Guardar movimiento';}
}

function clearForm(){
  ['f-fecha','f-unidad','f-operacion','f-desc','f-ingreso','f-egreso','f-metodo','f-nota'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('f-categoria').innerHTML='<option value="">Selecciona operacion primero</option>';
  document.getElementById('f-fecha').value=new Date().toISOString().slice(0,10);
}

window.addEventListener('DOMContentLoaded',function(){
  document.getElementById('sb-logo').src='data:image/png;base64,'+LOGO_B64;
  document.getElementById('f-fecha').value=new Date().toISOString().slice(0,10);
  populateSelects();
  fetchDolar(false);
  cargarDatos();
});
</script>
