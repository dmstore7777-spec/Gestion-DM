var total = DATA.length;

async function migrar() {
  document.getElementById('btn').disabled = true;
  document.getElementById('status').textContent = 'Migrando...';
  var errList = [];
  var ok = 0;

  try {
    var res = await fetch(SUPA_URL + '/rest/v1/productos_tiendas', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + SUPA_KEY,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(DATA)
    });
    if(res.ok) {
      ok = total;
      document.getElementById('bar').style.width = '100%';
      document.getElementById('counter').textContent = total + ' / ' + total;
      document.getElementById('status').innerHTML = '<span style="color:#1D9E75">Listo: <strong>' + total + ' productos</strong> cargados con stock en 0.</span>';
      document.getElementById('btn').textContent = 'Completado';
      return;
    } else {
      var errBody = await res.text();
      document.getElementById('status').innerHTML = '<span class="err">Error: ' + errBody.slice(0,200) + '</span>';
      document.getElementById('btn').disabled = false;
      document.getElementById('btn').textContent = 'Reintentar';
    }
  } catch(e) {
    document.getElementById('status').innerHTML = '<span class="err">Error de conexion: ' + e.message + '</span>';
